schema_version: llm-reservoir-experiment.v1
case: ../../../cases/fe_walter_reference/case.json
run_id: fe-walter-test-live-dkp
output: ../../../runs/fe-walter-test-live-dkp
max_calls: 3
models:
  reservoir_model:
    provider: ollama
    model: mock-model
    base_url: http://localhost:11434
    temperature: 0.7
    max_tokens: 2048
    seed: null
    timeout_seconds: 120
    api_key_env: null
auditors:
  release_limits: {type: release_bounds, version: "1"}
agents:
  fe_operator:
    reservoir_id: FEWalter
    type: llm
    model_profile: reservoir_model
    customization:
      backend: reference_v3_7
      parameters:
        reference:
          profile: fe_walter
          method: dkp
          system_prompt: ../../../examples/fe_walter/prompts/retrieved_knowledge.txt
          system_prompt_mode: custom
          dkp: ../../../examples/fe_walter/knowledge/operating_rules.md
          prompt_storage: false
          hide_availability_line: true
          dkp_no_missing_inputs: true
          zeroshot_knowledge: target
    auditors: [release_limits]
extensions:
  reference_v3_7: ../../../examples/fe_walter/extensions/__init__.py
