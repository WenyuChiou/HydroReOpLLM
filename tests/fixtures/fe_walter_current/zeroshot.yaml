output: ../../../runs/fe-walter-test-current-zeroshot
max_calls: 0
auditors:
  release_limits: {type: release_bounds, version: "1"}
agents:
  fe_operator:
    reservoir_id: FEWalter
    type: llm
    customization:
      backend: reference_v3_7
      execution: replay
      parameters:
        reference:
          profile: fe_walter
          method: zeroshot
          system_prompt: ../../../examples/fe_walter/prompts/available_information.txt
