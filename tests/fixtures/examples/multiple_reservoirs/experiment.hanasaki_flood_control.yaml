# Variant of the two-reservoir coupled study using the Hanasaki flood-control rule.
# Offline deterministic run (max_calls: 0); compare against experiment.yaml (benchmark Hanasaki rule).
schema_version: hydroops-coupled-simulation.v2
run_id: independent-rivers-hanasaki_flood_control  # Trace identity; change with output before repeating.
output: ../../runs/independent-rivers-hanasaki_flood_control  # Unused output path, relative to this file.
case: reservoirs.yaml                 # Shared two-reservoir network definition.
start_date: '2020-02-28'              # Inclusive operation start date.
end_date: '2020-03-02'                # Inclusive operation end date.
max_calls: 0                          # Zero model calls allowed.
hydrology:
  file: hydrology.yaml
agents:
  file: agents.hanasaki_flood_control.yaml  # Separate Hanasaki controller for lake_a and lake_b.
auditors:
  file: auditors.yaml
extensions:
  hanasaki_flood_control: ../rules/hanasaki_flood_control/__init__.py
