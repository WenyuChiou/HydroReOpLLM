# Deterministic Hanasaki flood-control controllers for lake_a and lake_b (0 model calls).
operator_a:
  reservoir_id: lake_a                # Key under reservoirs.yaml network.reservoirs.
  type: rule_based
  rule: hanasaki_flood_control        # Extension key in experiment.hanasaki_flood_control.yaml.
  rule_parameters:
    purpose: flood_control
    alpha: 0.85                       # Protected-storage ceiling = alpha * capacity_m3.
    inflow_statistics_file: statistics_a.json
  auditors: [bounds]
operator_b:
  reservoir_id: lake_b
  type: rule_based
  rule: hanasaki_flood_control
  rule_parameters:
    purpose: flood_control
    alpha: 0.85
    inflow_statistics_file: statistics_b.json
  auditors: [bounds]
