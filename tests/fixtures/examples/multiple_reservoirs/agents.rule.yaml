# Deterministic rule-based operators for lake_a and lake_b (0 model calls).
# Both use the Hanasaki extension registered in experiment.yaml and SHA-256 pinned statistics.
operator_a:
  reservoir_id: lake_a                # Key under reservoirs.yaml network.reservoirs.
  type: rule_based
  rule: hanasaki                      # Key under experiment.yaml extensions.
  rule_parameters:
    purpose: flood_control
    alpha: 0.85                       # Storage ratio parameter used by Hanasaki rule.
    inflow_statistics_file: statistics_a.json  # Generated by the test fixture.
  auditors:
  - bounds                            # Diagnostic auditor key in auditors.yaml.
operator_b:
  reservoir_id: lake_b
  type: rule_based
  rule: hanasaki
  rule_parameters:
    purpose: flood_control
    alpha: 0.85
    inflow_statistics_file: statistics_b.json  # Generated by the test fixture.
  auditors:
  - bounds
