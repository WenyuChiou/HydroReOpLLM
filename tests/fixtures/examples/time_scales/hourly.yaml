# Coupled Hourly synthetic demonstration using experimental gwlf_hourly runoff (0 model calls).
# Hourly runs use UTC ISO-8601 start_time / end_time and dt_seconds=3600.
schema_version: hydroops-coupled-simulation.v2
run_id: time-scale-hourly             # Trace identity; change with output before repeating.
output: ../../runs/time-scale-hourly  # Unused output directory, relative to this file.
case: hourly_reservoir.yaml           # Hourly single-reservoir physical network (network v3).
start_time: '2020-02-28T00:00:00Z'    # Inclusive first interval start (UTC).
end_time: '2020-03-03T00:00:00Z'      # Exclusive/horizon boundary (96 hourly steps).
max_calls: 0                          # Offline fixture makes 0 model calls.
time:
  simulation_step: hourly             # Step granularity: hourly (3600s).
  output_step: monthly                # Aggregated summary grouping.
hydrology:
  engine: gwlf_hourly                 # Direct hourly GWLF-derived runoff engine.
  forcing_step: hourly                # Matches hourly_forcing.csv interval.
  model: hourly_hydrology.yaml        # Catchment parameters & initial states.
  forcing: hourly_forcing.csv         # Columns: timestamp, subbasin_id, precipitation_mm, temperature_c, pet_cm, seasonal_temperature_c.
  inflow_bindings:
    I:
      routed: basin                   # Routed basin runoff feeds reservoir inlet node I.
    Outlet:
      constant: 0                     # Zero lateral runoff added at Outlet.
agents:
  fixture:
    reservoir: R                      # Matches reservoir key in hourly_reservoir.yaml.
    mode: offline                     # Fixed prescribed release (no LLM call).
    release_cms: 2.0                  # Requested release, m3/s.
    prompt:
      user: prompt.txt                # Prompt contract file (relative to this YAML).
    history_steps: 7                  # Recent completed steps included in $completed_history.
