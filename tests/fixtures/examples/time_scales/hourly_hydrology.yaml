# Synthetic hourly GWLF-derived catchment model for hourly.yaml (experimental engineering demo).
# Storages/depths are in cm, Area in hectares (ha), and dt_seconds in seconds (3600, 1800, or 900).
schema_version: hourly-gwlf-model.v1
start_time: '2020-02-27T00:00:00Z'    # Spin-up / forcing start timestamp (UTC ISO-8601).
dt_seconds: 3600                      # Model interval in seconds (1 hour).
steps: 120                            # Total forcing steps (5 days = 120 hours).
catchments:
  basin:
    parameters:
      CN2: 70                         # SCS Curve Number (0 < CN2 <= 100), dimensionless.
      IS: 0.2                         # Impervious surface fraction (0 <= IS <= 1), dimensionless.
      Res: 0.02                       # Daily-reference shallow groundwater recession rate (Res + Sep < 1).
      Sep: 0.01                       # Daily-reference deep percolation rate (Res + Sep < 1).
      Alpha: 0.12                     # Daily-reference snow/runoff or baseflow release coefficient.
      Beta: 0.2                       # Daily-reference deep seepage fraction (0 <= Beta <= 1).
      Ur: 8                           # Unsaturated zone storage threshold, cm (> 0).
      Kc: 0.8                         # Evapotranspiration cover coefficient, dimensionless.
      Df: 0.12                        # Degree-day snowmelt factor, cm / day / deg C.
    initial:
      Area: 1000                      # Catchment drainage area, hectares (ha).
      S0: 10                          # Initial saturated groundwater storage, cm.
      U0: 4                           # Initial unsaturated soil storage, cm.
      SnowS: 0.2                      # Initial snow water equivalent, cm.
      B0: 1                           # Initial deep groundwater storage, cm.
    dry_gap_hours: 24                 # Consecutive dry hours resetting the SCS-CN storm event.
    routing:
      dt_seconds: 3600                # Routing step in seconds (matches model dt_seconds).
      unit_hydrograph:                # Dimensionless causal routing weights summing to 1.0.
      - 0
      - 0.5
      - 0.5
