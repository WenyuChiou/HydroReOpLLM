# Two controlled agents + one passive reservoir. No model requests.
# Prompton's passive outlet/rating is configured in the case; it has no agent here.
# FE Walter/Beltzville meet on Lehigh branches; Prompton is on a separate branch.
# Paths are relative to this YAML. Fixed releases test the interface, not a strategy.
schema_version: llm-reservoir-experiment.v1      # Required configuration format.
case: ../../cases/fe_belt_prompton_offline/case_2016_01.json # Reservoirs, routing, physics and input CSV/hash.
run_id: three-reservoir-tutorial-31d      # Experiment ID; change for a new run.
output: ../../runs/three-reservoir-tutorial-31d # New output folder; cannot overwrite.
auditors:                                     # Available versioned decision checks.
  release_limits:                             # Checker ID selected by agents.
    type: release_bounds                      # Requested release vs feasible bounds.
    version: "1"                              # Version of this checker configuration.
agents:                                       # Only controlled reservoirs need entries.
  fe_operator:                                # Independent FE Walter agent.
    reservoir: FEWalter                       # Exact reservoir ID in case.json.
    mode: offline                             # Fixed test decision; no LLM.
    release_cms: 5                            # Requested controlled release, m³/s.
    prompt: ../../tests/fixtures/prompts/daily_release.txt       # User prompt template; system JSON contract is fixed.
    # DKP goes in knowledge: {operating_rules: path/to/FE_rules.md}; provide real rules.
    auditors: [release_limits]                 # Enabled checks for this agent.
  belt_operator:                              # Independent Beltzville agent.
    reservoir: Beltzville                     # Exact reservoir ID in case.json.
    mode: offline                             # Fixed test decision; no LLM.
    release_cms: 3                            # Requested controlled release, m³/s.
    prompt: ../../tests/fixtures/prompts/daily_release.txt       # Replace with this reservoir's own instructions.
    # DKP goes in knowledge: {operating_rules: path/to/Beltzville_rules.md}.
    auditors: [release_limits]                 # May choose different checks for each agent.
max_calls: 0 # Offline infrastructure test.
