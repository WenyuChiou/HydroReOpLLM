# First example: four days, three imaginary reservoirs R1 -> R2 -> R3, zero model calls.
# Paths are relative to this YAML; the real FE/Belt/Prompton network is different.
schema_version: llm-reservoir-experiment.v1  # Required configuration format.
case: ../cases/reservoir_network_fixture.json # Network, physical settings and daily input CSV/hash.
run_id: synthetic-cascade                   # Experiment ID; use a new ID on a second run.
output: ../runs/synthetic-cascade           # New output folder; existing results are protected.
auditors:                                  # Reusable decision-check configurations.
  release_limits:                          # Checker ID.
    type: release_bounds                   # Requested release vs available water/outlet bound.
    version: "1"                           # Version of this checker configuration.
agents:                                    # Three entries = three independent agents.
  upstream_operator:                       # Agent for the upstream reservoir.
    reservoir: R1                          # Must match a controlled reservoir ID in the case.
    mode: offline                          # Fixed fixture action, not an LLM decision.
    release_cms: 5                         # Requested controlled release in m³/s.
    prompt: ../templates/legacy/prompts/operator.txt    # User template; not rendered/called in offline mode.
    prompt_version: "1"                    # Prompt revision label; content has a SHA256 too.
    knowledge:                             # DKP/knowledge package ID -> UTF-8 text file.
      example_rules: ../examples/synthetic/knowledge/operating_rules.md # Imaginary example rules, not real dam policy.
    auditors: [release_limits]              # Enabled checks; PASS applies only to these checks.
  middle_operator:                         # Separate state, inputs and trace from R1.
    reservoir: R2                          # Middle reservoir; gets routed upstream outflow.
    mode: offline                          # No LLM request.
    release_cms: 6                         # Requested controlled release in m³/s.
    prompt: ../templates/legacy/prompts/operator.txt    # User prompt file, selected per agent.
    auditors: [release_limits]              # Enabled checker IDs.
  downstream_operator:                     # Separate downstream agent.
    reservoir: R3                          # Downstream reservoir ID in the case.
    mode: offline                          # No LLM request.
    release_cms: 6.5                       # Requested controlled release in m³/s.
    prompt: ../templates/legacy/prompts/operator.txt    # User prompt file, selected per agent.
    auditors: [release_limits]              # Enabled checker IDs.
