# Seven daily interface steps; no provider, download or calibration.
schema_version: llm-reservoir-experiment.v1 # YAML contract.
case: ../cases/fe_walter_dkp_offline/case.json # Physics, initial storage, routing and inflow.
run_id: fe-walter-dkp-offline              # Change together with output for a new run.
output: ../runs/fe-walter-dkp-offline      # Existing results are never overwritten.
start_date: "2015-10-01"                  # First daily reservoir-boundary inflow.
end_date: "2015-10-07"                    # Seven days; no old experiment replay.
max_calls: 0                             # Hard request budget for this example.
models:                                  # Optional future profile; inactive offline.
  local:
    provider: ollama                      # Interface only; not contacted here.
    base_url: http://localhost:11434       # No discovery request during check.
    model: gemma4:12b                     # Example existing model; no download.
    temperature: 0.7                     # Retained future sampling setting.
    max_tokens: 1024                     # Include structured audit metadata.
    timeout_seconds: 60                  # Future request timeout.
auditors:
  release_limits:
    type: release_bounds                 # Configured feasible request bounds.
    version: "1"
  dkp_strategy:
    type: dkp_strategy                   # Optional frozen DKP diagnostic plugin.
    version: "fe-diagnostic-1"
    knowledge_id: fe_walter_dkp           # Same DKP supplied to this agent's prompt.
    profile: ../cases/fe_walter_dkp_offline/audit_profile.json # Curve, targets, coverage.
agents:
  fe_operator:
    reservoir: FEWalter                  # Must match the case reservoir ID.
    mode: offline                        # Fixed test request, no fabricated model reasoning.
    release_cms: 5.0                     # Controlled release in m3/s; spill is separate.
    model: local                         # Saved settings only in offline mode.
    response_schema: reservoir-dkp-decision.v1 # Ten fields for a future structured model reply.
    prompt: ../prompts/daily_dkp_release.txt # Observation, DKP and previous physical feedback.
    prompt_version: "dkp-diagnostic-1"
    knowledge:
      fe_walter_dkp: ../examples/fe_walter/knowledge/DKP_FEWalter_Dam_v1.2.md # Frozen supplied source.
    context_file: ../cases/fe_walter_dkp_offline/context.json # Assumptions visible to the agent.
    auditors: [release_limits, dkp_strategy] # Both required; UNKNOWN never counts as PASS.

extensions:
  dkp_strategy: ../examples/fe_walter/extensions/__init__.py
  reservoir-dkp-decision.v1: ../examples/fe_walter/extensions/__init__.py
