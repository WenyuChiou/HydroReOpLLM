name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c environment/requirements-bundled.txt ".[test]"
      - run: python -m pytest -q
      - run: reservoir-experiment check examples/daily_offline/single.yaml
      - run: reservoir-experiment run examples/daily_offline/single.yaml
      - run: reservoir-experiment verify runs/daily-single --require-offline
