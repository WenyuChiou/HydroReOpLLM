name: Model-free validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and validation tools
        run: python -m pip install -e '.[test,docs]' build -c environment/requirements-bundled.txt
      - name: Check preserved compatibility and model-free interfaces
        run: python -m pytest -q tests --ignore=tests/test_information_end_to_end.py
      - name: Exercise information-to-operation paths with local HTTP fixtures
        timeout-minutes: 5
        env:
          OPENBLAS_NUM_THREADS: '1'
          HYDROOPS_E2E_OUTPUT: build/e2e
        # The loopback servers return fixtures; they perform no model inference.
        run: python -m pytest -q tests/test_information_end_to_end.py --junitxml=build/e2e-junit.xml
      - name: Preserve end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: information-e2e
          path: |
            build/e2e
            build/e2e-junit.xml
      - name: Execute saved-evidence tutorials without network
        run: python tutorials/build_notebooks.py --execute --check
      - name: Build HTML from saved outputs
        run: python docs/build.py
      - name: Validate documentation links and downloads
        run: python scripts/check_docs_site.py build/docs
      - name: Build package and check CLI
        run: |
          python -m build
          reservoir-experiment --help
      - name: Verify wheel outside the source checkout
        run: |
          python -m pip uninstall -y llm-reservoir-agent
          python -m pip install --no-deps dist/*.whl
          python -I scripts/check_installed_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: hydroopslm-html-and-package
          path: |
            build/docs
            dist
