site_name: HydroReOpLLM
site_description: Reproducible reservoir-operations software documentation
docs_dir: docs
site_dir: site
use_directory_urls: false
strict: true
plugins:
  - search
extra_css:
  - assets/branding/branding.css
extra_javascript:
  - assets/copy-code.js
theme:
  name: mkdocs
  custom_dir: docs/theme
  nav_style: light
  highlightjs: false
markdown_extensions:
  - toc:
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
nav:
  - English:
    - User manual: index.md
    - Start:
        - Installation: GETTING_STARTED.md
        - Offline tutorial: tutorials/index.md
    - Configure:
        - Configuration files: CONFIGURATION.md
        - Prepared inflows: starters/prepared/index.md
        - Hydrology: HYDROLOGY_SETUP.md
        - Coupled template: starters/coupled/index.md
        - Reservoir networks: MULTI_RESERVOIR.md
        - Time scales and units: TIME_SCALES.md
        - Model providers: MODEL_PROVIDERS.md
        - Available information: INFORMATION.md
    - Run and inspect:
        - Run, verify and resume: RUNNING.md
        - Read the results: RESULTS_GUIDE.md
    - Complete examples:
        - One reservoir and a cascade: examples/daily_offline/index.md
        - Two reservoirs with separate outlets: examples/multiple_reservoirs/index.md
        - Time-step examples: examples/time_scales/index.md
        - MOSART-Urban rule: examples/rules/mosart_urban/index.md
    - Help and reference:
        - Hourly GWLF: HOURLY_GWLF.md
        - Troubleshooting: TROUBLESHOOTING.md
  - 繁體中文:
    - 使用手冊: zh-TW.md
    - 開始使用:
        - 安裝與首次執行: GETTING_STARTED.zh-TW.md
        - 離線教學: tutorials/index.zh-TW.md
    - 設定模擬:
        - 設定檔: CONFIGURATION.zh-TW.md
        - 使用既有入流資料: starters/prepared/index.zh-TW.md
        - 水文模型設定: HYDROLOGY_SETUP.zh-TW.md
        - 耦合案例範本: starters/coupled/index.zh-TW.md
        - 水庫網路: BUILD_SIMULATION.zh-TW.md
        - 時間尺度與單位: TIME_SCALES.zh-TW.md
        - 模型服務: LLM_MODULES.zh-TW.md
        - 決策時可用的資訊: INFORMATION.zh-TW.md
    - 執行與檢查:
        - 執行、驗證與續跑: RUNNING.zh-TW.md
        - 解讀結果: RESULTS_GUIDE.zh-TW.md
    - 完整範例:
        - 單庫與串聯水庫: examples/daily_offline/index.zh-TW.md
        - 雙水庫各自出流範例: examples/multiple_reservoirs/index.zh-TW.md
        - 時間步長範例: examples/time_scales/index.zh-TW.md
        - MOSART-Urban 操作規則: examples/rules/mosart_urban/index.zh-TW.md
    - 說明與參考:
        - 逐時 GWLF: HOURLY_GWLF.zh-TW.md
        - 疑難排解: TROUBLESHOOTING.zh-TW.md
