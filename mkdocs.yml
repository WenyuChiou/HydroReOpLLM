site_name: HydroReOpLLM
site_description: Reproducible reservoir-operations software documentation
docs_dir: docs
site_dir: site
use_directory_urls: false
strict: true
plugins:
  - search
extra_css:
  - assets/branding/branding.css
extra_javascript:
  - assets/copy-code.js
theme:
  name: mkdocs
  custom_dir: docs/theme
  nav_style: light
  highlightjs: false
markdown_extensions:
  - md_in_html
  - toc:
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
nav:
  - English:
    - Overview: index.md
    - Quickstart & key configs:
        - Installation & CLI: GETTING_STARTED.md
        - Key configs & file map: CONFIGURATION.md
    - Hydrology & reservoir network:
        - Inflows & HydroCNHS: HYDROLOGY_SETUP.md
        - Reservoir network & routing: MULTI_RESERVOIR.md
        - Time scales & units: TIME_SCALES.md
    - Reservoir agents:
        - Rules, prompts & knowledge: AGENT_DESIGN.md
        - Gauges & forecasts: INFORMATION.md
        - Model providers: MODEL_PROVIDERS.md
    - Run, verify & results:
        - Run, verify & resume: RUNNING.md
        - Results & runtime metadata: RESULTS_GUIDE.md
    - Tutorials & cases:
        - 4-step tutorials (01–04): tutorials/index.md
        - Single-reservoir case (F.E. Walter): examples/fe_walter/index.md
        - Multi-reservoir case (Xindian River): examples/multi_reservoir/index.md
        - Troubleshooting: TROUBLESHOOTING.md
  - 繁體中文:
    - 套件總覽: zh-TW.md
    - 快速上手與關鍵設定:
        - 安裝與 CLI 指令: GETTING_STARTED.zh-TW.md
        - 關鍵設定檔總表: CONFIGURATION.zh-TW.md
    - 水文入流與水庫河網:
        - 入流與 HydroCNHS 設定: HYDROLOGY_SETUP.zh-TW.md
        - 水庫物理與河網串接: MULTI_RESERVOIR.zh-TW.md
        - 時間尺度與單位: TIME_SCALES.zh-TW.md
    - 水庫決策 Agent 設定:
        - 操作規則與 LLM 提示詞: AGENT_DESIGN.zh-TW.md
        - 水情測站與預報: INFORMATION.zh-TW.md
        - 模型服務連線: MODEL_PROVIDERS.zh-TW.md
    - 執行驗證與結果判讀:
        - 執行、驗證與續跑: RUNNING.zh-TW.md
        - 結果判讀與運行資訊: RESULTS_GUIDE.zh-TW.md
    - 實作課程與案例:
        - 四步實作課程（01–04）: tutorials/index.zh-TW.md
        - 單一水庫案例（F.E. Walter）: examples/fe_walter/index.zh-TW.md
        - 多水庫串聯案例（新店溪）: examples/multi_reservoir/index.zh-TW.md
        - 常見問題與排解: TROUBLESHOOTING.zh-TW.md
  - 简体中文:
    - 工具包总览: zh-CN.md
    - 快速上手与关键配置:
        - 安装与 CLI 命令: GETTING_STARTED.zh-CN.md
        - 关键配置文件总表: CONFIGURATION.zh-CN.md
    - 水文入流与水库河网:
        - 入流与 HydroCNHS 配置: HYDROLOGY_SETUP.zh-CN.md
        - 水库物理与河网串联: MULTI_RESERVOIR.zh-CN.md
        - 时间尺度与单位: TIME_SCALES.zh-CN.md
    - 水库决策 Agent 配置:
        - 操作规则与 LLM 提示词: AGENT_DESIGN.zh-CN.md
        - 水情测站与预报: INFORMATION.zh-CN.md
        - 模型服务配置: MODEL_PROVIDERS.zh-CN.md
    - 运行验证与结果判读:
        - 运行、验证与续跑: RUNNING.zh-CN.md
        - 结果解读与运行信息: RESULTS_GUIDE.zh-CN.md
    - 实战课程与案例:
        - 四步实战课程（01–04）: tutorials/index.zh-CN.md
        - 单一水库案例（F.E. Walter）: examples/fe_walter/index.zh-CN.md
        - 多水库串联案例（新店溪）: examples/multi_reservoir/index.zh-CN.md
        - 常见问题与排查: TROUBLESHOOTING.zh-CN.md
