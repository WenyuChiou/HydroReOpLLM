site_name: HydroReOpLLM
site_description: Reproducible reservoir-operations software documentation
docs_dir: docs
site_dir: site
use_directory_urls: false
strict: true
plugins:
  - search
extra_css:
  - assets/branding/branding.css
extra_javascript:
  - assets/copy-code.js
theme:
  name: mkdocs
  custom_dir: docs/theme
  nav_style: light
  highlightjs: false
markdown_extensions:
  - md_in_html
  - toc:
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
nav:
  - English:
    - User manual: index.md
    - Start:
        - Installation and first run: GETTING_STARTED.md
        - Generic prepared-inflow template: examples/template/index.md
        - F.E. Walter tutorial: tutorials/index.md
    - Hydrology (HydroCNHS):
        - Native HydroCNHS hydrology: HYDROLOGY_SETUP.md
        - Time scales and units: TIME_SCALES.md
        - Experimental hourly GWLF: HOURLY_GWLF.md
    - Operator & LLM design:
        - Operator & LLM agent design: AGENT_DESIGN.md
        - Decision-time information: INFORMATION.md
        - Model providers: MODEL_PROVIDERS.md
    - Coupling & execution:
        - Configuration files: CONFIGURATION.md
        - Reservoir networks: MULTI_RESERVOIR.md
        - Run, verify and resume: RUNNING.md
        - Read the results: RESULTS_GUIDE.md
    - Study & reference:
        - F.E. Walter Dam: examples/fe_walter/index.md
        - Troubleshooting: TROUBLESHOOTING.md
  - 繁體中文:
    - 使用手冊: zh-TW.md
    - 開始使用:
        - 安裝與首次執行: GETTING_STARTED.zh-TW.md
        - 通用既有入流範本: examples/template/index.zh-TW.md
        - F.E. Walter 教學: tutorials/index.zh-TW.md
    - 水文模擬 (HydroCNHS):
        - 原生 HydroCNHS 水文: HYDROLOGY_SETUP.zh-TW.md
        - 時間尺度與單位: TIME_SCALES.zh-TW.md
        - 實驗性逐時 GWLF: HOURLY_GWLF.zh-TW.md
    - 代理人與 LLM 設計:
        - 代理人與 LLM 設計: AGENT_DESIGN.zh-TW.md
        - 決策時資訊: INFORMATION.zh-TW.md
        - 模型服務: LLM_MODULES.zh-TW.md
    - 耦合與執行:
        - 設定檔: CONFIGURATION.zh-TW.md
        - 水庫網路: BUILD_SIMULATION.zh-TW.md
        - 執行、驗證與續跑: RUNNING.zh-TW.md
        - 解讀結果: RESULTS_GUIDE.zh-TW.md
    - 案例與疑難排解:
        - F.E. Walter Dam: examples/fe_walter/index.zh-TW.md
        - 疑難排解: TROUBLESHOOTING.zh-TW.md
