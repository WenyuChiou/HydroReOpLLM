# Native HydroCNHS catchment model and ERA5 forcing bindings for the Xindian River cascade (2018-01-01 to 2020-06-05).
# Used to produce calibrated and validated daily local inflows (inflows.csv) for Feitsui Reservoir and Zhitan Dam.
model: xindian_catchments.yaml
forcing: forcing.csv
zero_flow_nodes: []
inflow_bindings:
  feitsui_local:
    routed: U1
  zhitan_local:
    routed: D1
  xindian_outlet:
    constant: 0
