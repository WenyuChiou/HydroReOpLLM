# Native HydroCNHS catchment model and 11-year ERA5 forcing bindings for the Xindian River cascade (2015-2025).
model: xindian_catchments.yaml
forcing: forcing.csv.gz
zero_flow_nodes: []
inflow_bindings:
  feitsui_local:
    routed: U1
  zhitan_local:
    routed: D1
  xindian_outlet:
    constant: 0
