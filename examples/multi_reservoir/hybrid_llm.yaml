# Hybrid Xindian River cascade (Full-year 2025 validation window): joint-dispatch LLM (Feitsui) + Hanasaki (Zhitan).
# Uses the unified F.E. Walter seasonal-target decision-chain prompt architecture with downstream Nanshi lateral inflow.
# Run check offline (0 network calls); live execution requires Ollama (gemma4:12b) and --allow-network.
schema_version: llm-reservoir-experiment.v1
case: case.json
run_id: multi-reservoir-hybrid-llm
output: ../../runs/multi-reservoir-hybrid-llm
start_date: '2025-01-01'
end_date: '2025-12-31'
max_calls: 730
models:
  local:
    provider: ollama
    model: gemma4:12b
    base_url: http://127.0.0.1:11434
    temperature: 0.7
    seed: 3
    num_ctx: 16384
    max_tokens: 2048
    max_attempts: 2
    think: false
    keep_alive: 30m
    timeout_seconds: 120
    retry_delay_seconds: 2
auditors:
  feasible_release:
    type: release_bounds
    version: '1'
agents:
  feitsui_operator:
    reservoir: feitsui
    mode: llm
    model: local
    strategy: xindian_study
    auditors:
    - feasible_release
  zhitan_operator:
    reservoir: zhitan
    mode: offline
    strategy: benchmark
    benchmark:
      statistics: zhitan_statistics.json
      purpose: flood_control
      alpha: 0.85
    auditors:
    - feasible_release
extensions:
  xindian_study: study/__init__.py
source_dependencies:
  prompts/feitsui.system.txt: 1666918c1dbc5429ce06b7b73cd0c93ff361840b62343b1397915c7c70303cf6
  study/elevation_storage.csv: a1d01190f6c8ba4c1e249a673ae0617bbdb6b8d88ecaf9cd517e9cf7975c4bb9
  study/response_schemas.json: d9c6a783b41f1313b528abc6d6178701acdab0c08fcfe07e74a0fbe52841ef42
