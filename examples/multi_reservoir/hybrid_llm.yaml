# Hybrid Xindian River cascade (Full-year 2025 validation window): upstream LLM (Feitsui) + downstream Hanasaki (Zhitan).
# Uses the unified F.E. Walter seasonal-target decision-chain prompt architecture (xindian_study).
# Run check offline (0 network calls); live execution requires Ollama (gemma4:12b) and --allow-network.
schema_version: llm-reservoir-experiment.v1
case: case.json                       # Physical cascade: Feitsui Reservoir -> Zhitan Dam -> xindian_outlet.
run_id: multi-reservoir-hybrid-llm    # Trace identity; change with output before repeating.
output: ../../runs/multi-reservoir-hybrid-llm  # Unused output path, relative to this file.
start_date: '2025-01-01'              # Inclusive 1-year validation operation start date (365 daily steps).
end_date: '2025-12-31'                # Inclusive operation end date.
max_calls: 730                        # 1 LLM agent x 365 days = 365 planned calls (up to 2 attempts/day).
models:
  local:
    provider: ollama
    model: gemma4:12b
    base_url: http://127.0.0.1:11434
    temperature: 0.7
    seed: 3
    num_ctx: 16384
    max_tokens: 2048
    max_attempts: 2
    think: false
    keep_alive: 30m
    timeout_seconds: 120
    retry_delay_seconds: 2
auditors:
  feasible_release:
    type: release_bounds
    version: '1'
agents:
  feitsui_operator:
    reservoir: feitsui
    mode: llm
    model: local
    strategy: xindian_study
    auditors:
    - feasible_release
  zhitan_operator:
    reservoir: zhitan
    mode: offline
    strategy: benchmark
    benchmark:
      statistics: zhitan_statistics.json
      purpose: flood_control
      alpha: 0.85
    auditors:
    - feasible_release
extensions:
  xindian_study: study/__init__.py
source_dependencies:
  prompts/feitsui.system.txt: 3ce9ac87508ec1533e52c41f7aa07a54fbf042f70b3627ee15204007233b1ebb
  study/elevation_storage.csv: a1d01190f6c8ba4c1e249a673ae0617bbdb6b8d88ecaf9cd517e9cf7975c4bb9
  study/response_schemas.json: d9c6a783b41f1313b528abc6d6178701acdab0c08fcfe07e74a0fbe52841ef42
