# Offline Xindian River cascade baseline (Full-year 2025 validation window): Feitsui -> Zhitan -> xindian_outlet.
# Both reservoirs use deterministic Hanasaki flood-control rules calibrated from 2016-2022 TFRA statistics.
schema_version: llm-reservoir-experiment.v1
case: case.json                       # Physical cascade: Feitsui Reservoir -> Zhitan Dam -> xindian_outlet.
run_id: multi-reservoir-rule-based    # Trace identity; change with output before repeating.
output: ../../runs/multi-reservoir-rule-based  # Unused output path, relative to this file.
start_date: '2025-01-01'              # Inclusive 1-year validation operation start date (365 daily steps).
end_date: '2025-12-31'                # Inclusive operation end date.
max_calls: 0                          # Zero model calls allowed.
auditors:
  feasible_release:
    type: release_bounds
    version: '1'
agents:
  feitsui_operator:
    reservoir: feitsui
    mode: offline
    strategy: benchmark
    benchmark:
      statistics: feitsui_statistics.json
      purpose: flood_control
      alpha: 0.85
    auditors:
    - feasible_release
  zhitan_operator:
    reservoir: zhitan
    mode: offline
    strategy: benchmark
    benchmark:
      statistics: zhitan_statistics.json
      purpose: flood_control
      alpha: 0.85
    auditors:
    - feasible_release
