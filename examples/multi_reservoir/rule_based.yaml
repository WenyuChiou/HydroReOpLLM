# Offline Xindian River cascade baseline (Taiwan WRA May 2020 Mei-Yu event): Feitsui -> Zhitan.
# Both reservoirs use deterministic Hanasaki flood-control rules; run check, run, and verify --require-offline.
schema_version: llm-reservoir-experiment.v1
case: case.json                       # Physical cascade: Feitsui Reservoir -> Zhitan Dam -> xindian_outlet.
run_id: multi-reservoir-rule-based    # Trace identity; change with output before repeating.
output: ../../runs/multi-reservoir-rule-based  # Unused output path, relative to this file.
start_date: '2020-05-20'              # Inclusive Mei-Yu storm operation start date (subset inside inflows.csv).
end_date: '2020-05-29'                # Inclusive operation end date (10 daily steps).
max_calls: 0                          # Zero model calls allowed.
auditors:
  feasible_release:
    type: release_bounds
    version: '1'
agents:
  feitsui_operator:
    reservoir: feitsui
    mode: offline
    strategy: benchmark
    benchmark:
      statistics: feitsui_statistics.json
      purpose: flood_control
      alpha: 0.85
    auditors:
    - feasible_release
  zhitan_operator:
    reservoir: zhitan
    mode: offline
    strategy: benchmark
    benchmark:
      statistics: zhitan_statistics.json
      purpose: flood_control
      alpha: 0.85
    auditors:
    - feasible_release
