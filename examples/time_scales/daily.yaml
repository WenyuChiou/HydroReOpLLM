# Coupled Daily time-step example reusing the two-reservoir study.
# `time.simulation_step: daily` drives 86400s operation steps; `output_step: monthly` groups summaries.
schema_version: hydroops-coupled-simulation.v2
run_id: time-scale-daily              # Trace identity; change with output before repeating.
output: ../../runs/time-scale-daily   # Unused output directory, relative to this file.
case: ../multiple_reservoirs/reservoirs.yaml
start_date: '2020-02-28'              # Daily mode uses YYYY-MM-DD dates.
end_date: '2020-03-02'
max_calls: 0                          # Rule-based operators make 0 model calls.
hydrology:
  file: ../multiple_reservoirs/hydrology.yaml
agents:
  file: ../multiple_reservoirs/agents.rule.yaml
models:
  file: ../multiple_reservoirs/models.yaml
information:
  file: ../multiple_reservoirs/information.yaml
auditors:
  file: ../multiple_reservoirs/auditors.yaml
extensions:
  local_retrieval: ../multiple_reservoirs/extensions/__init__.py
  hanasaki: ../rules/hanasaki/__init__.py
time:
  simulation_step: daily              # Step granularity: daily (86400s).
  output_step: monthly                # Aggregated summary grouping.
