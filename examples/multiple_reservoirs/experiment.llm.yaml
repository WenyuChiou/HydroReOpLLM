# Mixed-operator variant: lake_a uses an LLM agent (models.yaml) and lake_b uses Hanasaki.
# `check` runs offline; `run` requires --allow-network and a configured model in models.yaml.
schema_version: hydroops-coupled-simulation.v2
run_id: independent-rivers-mixed      # Trace identity; change with output before repeating.
output: ../../runs/independent-rivers-mixed  # Unused output path, relative to this file.
case: reservoirs.yaml
start_date: '2020-02-28'
end_date: '2020-03-02'
max_calls: null                       # Optional ceiling on total provider attempts.
hydrology:
  file: hydrology.yaml
agents:
  file: agents.llm.yaml               # Mixed LLM + rule_based operator definitions.
models:
  file: models.yaml
information:
  file: information.yaml
auditors:
  file: auditors.yaml
extensions:
  local_retrieval: extensions/__init__.py
  hanasaki: ../rules/hanasaki/__init__.py
