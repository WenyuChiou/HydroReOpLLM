# F.E. Walter study inputs with a seven-day tutorial window.
schema_version: llm-reservoir-experiment.v1
case: case.json
run_id: fe-walter-seasonal-target
output: ../../runs/fe-walter-seasonal-target
start_date: '2021-01-01'
end_date: '2021-01-07'
max_calls: 14                         # Seven days, up to two attempts per decision.
models:
  local:
    provider: ollama
    model: gemma4:12b
    base_url: http://127.0.0.1:11434
    temperature: 0.7
    seed: 3
    num_ctx: 16384
    max_tokens: 2048
    max_attempts: 2
    think: false
auditors:
  release_bounds:
    type: release_bounds
    version: '1'
agents:
  walter_operator:
    reservoir: FEWalter
    mode: llm
    model: local
    prompt:
      system: prompts/seasonal_target.system.txt
      user: prompts/seasonal_target.user.txt
    auditors: [release_bounds]
