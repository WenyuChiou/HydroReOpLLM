# HydroOpsLM offline teaching run; original settings/results are preserved.
# FE Walter V3.7 dkp: original prompt builders, synthetic replies, zero model calls.
schema_version: llm-reservoir-experiment.v1
case: ../../../cases/fe_walter_reference/case.json # Frozen hydrology sample; V3.7 physics.
run_id: hydroopslm-fe-walter-dkp        # Change with output before a new run.
output: ../../../runs/hydroopslm-fe-walter-dkp
max_calls: 0                             # This example cannot call a provider.
auditors:
  release_limits:
    type: release_bounds
    version: "1"
agents:
  fe_operator:
    reservoir_id: FEWalter                  # Reservoir ID in case.json.
    type: llm
    customization:
      backend: reference_v3_7
      execution: replay # Saved fixture replies; no provider calls.
      parameters:
        reference:
          profile: fe_walter                 # This reference profile is FE-specific.
          method: dkp                   # Original zero-shot or DKP policy.
          system_prompt: ../prompts/reference/dkp_system.txt # Actual system instructions, read at runtime.
          system_prompt_mode: original       # Exact original text; use custom for an intentional variant.
          responses: ../../../tests/fixtures/dkp_responses.json
          prompt_storage: false             # Matches saved five-year prompt condition.
          hide_availability_line: true       # Keep numeric availability ceiling out of prompt.
          dkp_no_missing_inputs: true        # Original V3.7 DKP condition.
          zeroshot_knowledge: target         # Original public facts + seasonal target.
          dkp: ../knowledge/DKP_FEWalter_Dam_v1.2.md # Native retrieval, not full paste.
    auditors: [release_limits]           # Preserve native audit plus generic bounds.

extensions:
  reference_v3_7: ../extensions/__init__.py
