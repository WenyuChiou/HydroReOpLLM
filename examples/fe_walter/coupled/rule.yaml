schema_version: hydroops-coupled-simulation.v1
run_id: fe-walter-coupled-rule
case: reservoirs.json
output: ../../../runs/fe-walter-coupled-rule
start_date: '2016-01-01'
end_date: '2016-12-31'
max_calls: 0
agents:
  fe_operator:
    reservoir: FEWalter
    mode: offline
    strategy: benchmark
    benchmark:
      purpose: flood_control
      alpha: 0.85
      statistics: ../../../data/benchmark/fe_walter_statistics.json
    auditors:
    - release_limits
auditors:
  release_limits:
    type: release_bounds
    version: '1'
hydrology:
  model: ../../../data/accepted/fe_walter_hydrology.yaml
  forcing: ../../../data/accepted/fe_walter_forcing_1989_2025.csv.gz
  zero_flow_nodes:
  - __AGGREGATION_OUTLET__
  inflow_bindings:
    FEW_INFLOW:
      routed: __AGGREGATION_OUTLET__
    Downstream:
      constant: 0
