# Agent layer. fe_operator is the decision-unit ID used in plans and traces.
fe_operator:
  reservoir_id: FEWalter  # Controlled reservoir ID in reservoirs.json.
  type: rule_based        # Deterministic method: no model profile or provider.
  rule: hanasaki          # Generic registered rule ID; Hanasaki is this example's module.
  # Parameters belong to that module rather than to the core agent schema.
  rule_parameters:
    purpose: flood_control  # Hanasaki operating-purpose category.
    alpha: 0.85             # Dimensionless usable-capacity fraction (0, 1].
    # Relative to this file.
    inflow_statistics_file: ../../../data/benchmark/fe_walter_statistics.json
  # Auditor IDs refer to profiles in auditors.yaml.
  auditors:
  - release_limits
