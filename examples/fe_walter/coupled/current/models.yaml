# Shared provider profile. Agents select it with model_profile: reservoir_model.
reservoir_model: # Reusable profile ID, separate from the provider's model name.
  provider: ollama # Local Ollama HTTP protocol.
  model: gemma4:12b # Exact model tag already installed in Ollama.
  base_url: http://localhost:11434 # Ollama server root; the loader adds /api/chat.
  temperature: 0.7 # Dimensionless sampling control (0 to 2).
  max_tokens: 2048 # Maximum generated tokens; sent to Ollama as num_predict.
  num_ctx: 16384 # Ollama context-window size in tokens.
  think: false # Do not request Ollama's separate thinking output.
  keep_alive: 30m # How long Ollama keeps the model loaded after a request.
  seed: null # Use the provider default rather than a fixed integer seed.
  timeout_seconds: 120 # Timeout for each provider attempt, in seconds.
  api_key_env: null # No environment-variable credential for this local endpoint.
  max_attempts: 2 # Total tries per decision, including the first try.
  retry_delay_seconds: 2 # Wait between retryable attempts, in seconds.
