# Hanasaki rule and reservoir settings used in the paper.
schema_version: llm-reservoir-experiment.v1
case: rule_case.json
run_id: fe-walter-rule-based
output: ../../runs/fe-walter-rule-based
start_date: '2021-01-01'
end_date: '2021-01-07'
max_calls: 0
auditors:
  release_bounds:
    type: release_bounds
    version: '1'
agents:
  walter_operator:
    reservoir: FEWalter
    mode: offline
    strategy: hanasaki
    auditors:
    - release_bounds
    agent_type: rule_based
    rule_parameters:
      purpose: flood_control
      alpha: 0.85
      inflow_statistics_file: rule_statistics.json
extensions:
  hanasaki: study/rule/__init__.py
