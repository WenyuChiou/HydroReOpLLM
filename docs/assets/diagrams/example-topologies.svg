<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="Single, cascade, and twin separate-outlet network topologies">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#173334"/>
    </marker>
    <style>
      .title { font: 700 17px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #173334; }
      .node { font: 700 14.5px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #173334; }
      .mono { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #096c70; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="316" rx="14" fill="#f4f1ea" stroke="#34474b" stroke-width="1.5"/>

  <!-- 1. Single -->
  <rect x="20" y="20" width="292" height="280" rx="10" fill="#ffffff" stroke="#b9cbca" stroke-width="1.4"/>
  <text x="166" y="48" text-anchor="middle" class="title">1. Single</text>
  <text x="166" y="68" text-anchor="middle" class="mono">daily_offline/single.yaml</text>

  <rect x="96" y="88" width="140" height="40" rx="8" fill="#eef4f4" stroke="#096c70" stroke-width="1.4"/>
  <text x="166" y="113" text-anchor="middle" class="node">local_1</text>
  <line x1="166" y1="128" x2="166" y2="156" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="96" y="160" width="140" height="44" rx="8" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.5"/>
  <text x="166" y="187" text-anchor="middle" class="node">Lake_1</text>
  <line x1="166" y1="204" x2="166" y2="234" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="106" y="238" width="120" height="38" rx="19" fill="#c8dfd5" stroke="#2d6352" stroke-width="1.4"/>
  <text x="166" y="262" text-anchor="middle" class="node">outlet</text>

  <!-- 2. Cascade -->
  <rect x="334" y="20" width="292" height="280" rx="10" fill="#ffffff" stroke="#b9cbca" stroke-width="1.4"/>
  <text x="480" y="48" text-anchor="middle" class="title">2. Cascade</text>
  <text x="480" y="68" text-anchor="middle" class="mono">daily_offline/cascade.yaml</text>

  <rect x="372" y="88" width="118" height="40" rx="8" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.4"/>
  <text x="431" y="113" text-anchor="middle" class="node">Lake_1</text>
  <line x1="431" y1="128" x2="431" y2="156" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="372" y="160" width="118" height="40" rx="8" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.4"/>
  <text x="431" y="185" text-anchor="middle" class="node">Lake_2</text>
  <line x1="431" y1="200" x2="431" y2="232" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="372" y="236" width="118" height="40" rx="8" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.4"/>
  <text x="431" y="261" text-anchor="middle" class="node">Lake_3</text>
  <line x1="490" y1="256" x2="520" y2="256" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="524" y="237" width="82" height="38" rx="19" fill="#c8dfd5" stroke="#2d6352" stroke-width="1.4"/>
  <text x="565" y="261" text-anchor="middle" class="node">outlet</text>

  <!-- 3. Separate outlets -->
  <rect x="648" y="20" width="292" height="280" rx="10" fill="#ffffff" stroke="#b9cbca" stroke-width="1.4"/>
  <text x="794" y="48" text-anchor="middle" class="title">3. Separate Outlets</text>
  <text x="794" y="68" text-anchor="middle" class="mono">multiple_reservoirs/</text>

  <rect x="668" y="88" width="116" height="40" rx="8" fill="#eef4f4" stroke="#096c70" stroke-width="1.4"/>
  <text x="726" y="113" text-anchor="middle" class="node">basin_a</text>
  <line x1="726" y1="128" x2="726" y2="156" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="668" y="160" width="116" height="44" rx="8" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.5"/>
  <text x="726" y="187" text-anchor="middle" class="node">lake_a</text>
  <line x1="726" y1="204" x2="726" y2="234" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="674" y="238" width="104" height="38" rx="19" fill="#c8dfd5" stroke="#2d6352" stroke-width="1.4"/>
  <text x="726" y="262" text-anchor="middle" class="node">river_a</text>

  <rect x="804" y="88" width="116" height="40" rx="8" fill="#eef4f4" stroke="#096c70" stroke-width="1.4"/>
  <text x="862" y="113" text-anchor="middle" class="node">basin_b</text>
  <line x1="862" y1="128" x2="862" y2="156" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="804" y="160" width="116" height="44" rx="8" fill="#f6dfc6" stroke="#8a5a2b" stroke-width="1.5"/>
  <text x="862" y="187" text-anchor="middle" class="node">lake_b</text>
  <line x1="862" y1="204" x2="862" y2="234" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="810" y="238" width="104" height="38" rx="19" fill="#c8dfd5" stroke="#2d6352" stroke-width="1.4"/>
  <text x="862" y="262" text-anchor="middle" class="node">river_b</text>
</svg>
