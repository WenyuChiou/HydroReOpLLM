<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="HydroReOpLLM package structure and configuration graph">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#173334"/>
    </marker>
    <style>
      .title { font: 700 18px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #173334; }
      .lbl { font: 700 15px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #173334; }
      .mono { font: 600 14.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #096c70; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="316" rx="14" fill="#f4f1ea" stroke="#34474b" stroke-width="1.5"/>

  <!-- Left: Package -->
  <rect x="20" y="20" width="420" height="280" rx="10" fill="#ffffff" stroke="#b9cbca" stroke-width="1.4"/>
  <text x="38" y="48" class="title">Package</text>

  <rect x="40" y="64" width="380" height="44" rx="8" fill="#eef4f4" stroke="#096c70" stroke-width="1.5"/>
  <text x="230" y="92" text-anchor="middle" class="mono">hydroreopllm</text>
  <line x1="230" y1="108" x2="230" y2="128" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="132" width="380" height="44" rx="8" fill="#eef4f4" stroke="#096c70" stroke-width="1.5"/>
  <text x="230" y="160" text-anchor="middle" class="mono">reservoir-experiment</text>
  <line x1="130" y1="176" x2="130" y2="196" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="330" y1="176" x2="330" y2="196" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="200" width="182" height="44" rx="8" fill="#f6dfc6" stroke="#8a5a2b" stroke-width="1.4"/>
  <text x="131" y="228" text-anchor="middle" class="mono">llm_reservoir_agent</text>

  <rect x="238" y="200" width="182" height="44" rx="8" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.4"/>
  <text x="329" y="228" text-anchor="middle" class="mono">hydrocnhs</text>

  <rect x="40" y="254" width="380" height="34" rx="7" fill="#c8dfd5" stroke="#2d6352" stroke-width="1.3"/>
  <text x="230" y="276" text-anchor="middle" class="mono">examples/</text>

  <!-- Right: Config Graph -->
  <rect x="460" y="20" width="480" height="280" rx="10" fill="#ffffff" stroke="#b9cbca" stroke-width="1.4"/>
  <text x="478" y="48" class="title">Config Graph</text>

  <rect x="480" y="132" width="148" height="52" rx="8" fill="#eef4f4" stroke="#096c70" stroke-width="1.5"/>
  <text x="554" y="164" text-anchor="middle" class="mono">experiment.yaml</text>

  <line x1="628" y1="142" x2="658" y2="82" stroke="#173334" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="628" y1="150" x2="658" y2="124" stroke="#173334" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="628" y1="158" x2="658" y2="166" stroke="#173334" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="628" y1="166" x2="658" y2="210" stroke="#173334" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="628" y1="174" x2="658" y2="256" stroke="#173334" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="662" y="64" width="260" height="36" rx="7" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.3"/>
  <text x="792" y="87" text-anchor="middle" class="mono">reservoirs.yaml</text>

  <rect x="662" y="108" width="260" height="36" rx="7" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.3"/>
  <text x="792" y="131" text-anchor="middle" class="mono">hydrology.yaml</text>

  <rect x="662" y="152" width="260" height="36" rx="7" fill="#f6dfc6" stroke="#8a5a2b" stroke-width="1.3"/>
  <text x="792" y="175" text-anchor="middle" class="mono">agents.*.yaml</text>

  <rect x="662" y="196" width="260" height="36" rx="7" fill="#eef4f4" stroke="#096c70" stroke-width="1.3"/>
  <text x="792" y="219" text-anchor="middle" class="mono">models.yaml / information.yaml</text>

  <rect x="662" y="240" width="260" height="36" rx="7" fill="#c8dfd5" stroke="#2d6352" stroke-width="1.3"/>
  <text x="792" y="263" text-anchor="middle" class="mono">auditors.yaml / extensions/</text>
</svg>
