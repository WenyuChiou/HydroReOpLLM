<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="HydroReOpLLM package structure and split configuration graph">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#173334"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #173334; }
      .sec { font: 700 16px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #173334; }
      .lbl { font: 700 14px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #173334; }
      .sub { font: 400 12.5px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #355052; }
      .mono { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #096c70; }
      .note { font: 400 12px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #52686a; }
    </style>
  </defs>

  <rect x="2" y="2" width="1096" height="466" rx="14" fill="#f4f1ea" stroke="#34474b" stroke-width="1.5"/>
  <text x="28" y="36" class="title">HydroReOpLLM Package &amp; Configuration Architecture</text>

  <!-- Left panel: Package & CLI -->
  <rect x="24" y="54" width="460" height="390" rx="10" fill="#ffffff" stroke="#b9cbca" stroke-width="1.4"/>
  <text x="42" y="82" class="sec">Python Distribution (PyPI: hydroreopllm)</text>

  <!-- CLI Box -->
  <rect x="44" y="102" width="420" height="72" rx="8" fill="#eef4f4" stroke="#096c70" stroke-width="1.5"/>
  <text x="60" y="127" class="lbl">CLI Entry: <tspan class="mono">reservoir-experiment</tspan></text>
  <text x="60" y="152" class="sub">init-examples  ·  check  ·  prepare  ·  run  ·  verify  ·  resume</text>

  <line x1="150" y1="174" x2="150" y2="206" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="360" y1="174" x2="360" y2="206" stroke="#173334" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- llm_reservoir_agent -->
  <rect x="44" y="210" width="212" height="148" rx="8" fill="#f6dfc6" stroke="#8a5a2b" stroke-width="1.4"/>
  <text x="60" y="236" class="mono">llm_reservoir_agent</text>
  <text x="60" y="260" class="sub">• YAML &amp; schema validation</text>
  <text x="60" y="282" class="sub">• Rule / offline / LLM operators</text>
  <text x="60" y="304" class="sub">• Prompt &amp; information views</text>
  <text x="60" y="326" class="sub">• Auditors, trace &amp; verification</text>

  <!-- bundled hydrocnhs -->
  <rect x="272" y="210" width="192" height="148" rx="8" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.4"/>
  <text x="288" y="236" class="mono">hydrocnhs (bundled)</text>
  <text x="288" y="260" class="sub">• GWLF / ABCD runoff</text>
  <text x="288" y="282" class="sub">• Lohmann river routing</text>
  <text x="288" y="304" class="sub">• Reservoir physical step</text>
  <text x="288" y="326" class="sub">• Mass-balance kernel</text>

  <!-- Bundled data -->
  <rect x="44" y="374" width="420" height="52" rx="8" fill="#c8dfd5" stroke="#2d6352" stroke-width="1.4"/>
  <text x="60" y="397" class="lbl">Bundled Data (<tspan class="mono">share/llm-reservoir-agent/</tspan>)</text>
  <text x="60" y="416" class="sub" font-size="11.5">examples/ (daily_offline, multiple_reservoirs, time_scales, rules)</text>

  <!-- Right panel: Split YAML config -->
  <rect x="508" y="54" width="568" height="390" rx="10" fill="#ffffff" stroke="#b9cbca" stroke-width="1.4"/>
  <text x="526" y="82" class="sec">Configuration Graph (<tspan class="mono">experiment.yaml</tspan>)</text>

  <!-- Root experiment.yaml -->
  <rect x="528" y="102" width="236" height="92" rx="8" fill="#eef4f4" stroke="#096c70" stroke-width="1.5"/>
  <text x="544" y="128" class="mono">experiment.yaml</text>
  <text x="544" y="150" class="sub">run_id, output, dates, max_calls</text>
  <text x="544" y="170" class="sub">Links files relative to this YAML</text>

  <!-- Two modes note -->
  <rect x="528" y="212" width="236" height="106" rx="8" fill="#fafcfc" stroke="#b9cbca" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="544" y="236" class="lbl">Two Input Styles</text>
  <text x="544" y="258" class="sub">1. Prepared inflows:</text>
  <text x="556" y="276" class="note">single YAML + case.json / CSV</text>
  <text x="544" y="296" class="sub">2. Coupled HydroCNHS:</text>
  <text x="556" y="312" class="note">split {file: ...} sections below</text>

  <!-- Connectors -->
  <line x1="764" y1="128" x2="808" y2="128" stroke="#173334" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="764" y1="146" x2="808" y2="188" stroke="#173334" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="764" y1="162" x2="808" y2="248" stroke="#173334" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="764" y1="176" x2="808" y2="308" stroke="#173334" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="764" y1="186" x2="808" y2="368" stroke="#173334" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Right linked files -->
  <rect x="812" y="102" width="244" height="48" rx="7" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.3"/>
  <text x="826" y="123" class="mono">reservoirs.yaml</text>
  <text x="826" y="140" class="note">Storage, bounds, routing, outlets</text>

  <rect x="812" y="162" width="244" height="48" rx="7" fill="#dbeaf5" stroke="#2c5f7c" stroke-width="1.3"/>
  <text x="826" y="183" class="mono">hydrology.yaml</text>
  <text x="826" y="200" class="note">Catchment model, forcing, bindings</text>

  <rect x="812" y="222" width="244" height="48" rx="7" fill="#f6dfc6" stroke="#8a5a2b" stroke-width="1.3"/>
  <text x="826" y="243" class="mono">agents.*.yaml + prompts/</text>
  <text x="826" y="260" class="note">Offline, rule_based, or LLM operator</text>

  <rect x="812" y="282" width="244" height="48" rx="7" fill="#eef4f4" stroke="#096c70" stroke-width="1.3"/>
  <text x="826" y="303" class="mono">models.yaml &amp; information.yaml</text>
  <text x="826" y="320" class="note">Provider profile &amp; read-only views</text>

  <rect x="812" y="342" width="244" height="48" rx="7" fill="#c8dfd5" stroke="#2d6352" stroke-width="1.3"/>
  <text x="826" y="363" class="mono">auditors.yaml &amp; extensions/</text>
  <text x="826" y="380" class="note">Release-bounds audits &amp; custom rules</text>

  <text x="528" y="422" class="note">All relative paths inside any config are resolved relative to the file that declares them.</text>
</svg>
