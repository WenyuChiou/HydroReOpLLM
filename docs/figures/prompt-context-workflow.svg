<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="462" viewBox="0 0 1200 462" role="img" aria-labelledby="prompt-context-workflow-title prompt-context-workflow-desc">
  <title id="prompt-context-workflow-title">Prompt construction with optional knowledge</title>
  <desc id="prompt-context-workflow-desc">State and completed history enter prompt construction. Optional knowledge enters that prompt. Rendered user and optional system messages go to the Large Language Model. Response validation returns a requested release. The knowledge box has a dashed border because it is optional.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 5L0 10Z" fill="#39718a" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 5L0 10Z" fill="#a66b3d" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 5L0 10Z" fill="#36735f" />
    </marker>
  </defs>
  <rect width="1200" height="462" fill="#fff" />
  <g font-family="Arial, sans-serif" fill="#233d39">
    <text x="40" y="38" text-anchor="start" font-size="26" font-weight="700" fill="#233d39">Prompt and response</text>
    <path d="M272 256H352" fill="none" stroke="#36735f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)" />
    <path d="M472 140V196" fill="none" stroke="#36735f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)" />
    <path d="M592 256H672" fill="none" stroke="#36735f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)" />
    <path d="M888 256H968" fill="none" stroke="#36735f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)" />
    <path d="M1076 316V354" fill="none" stroke="#36735f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)" />
    <text x="312" y="232" text-anchor="middle" font-size="19" font-weight="400" fill="#233d39">Data</text>
    <text x="632" y="232" text-anchor="middle" font-size="19" font-weight="400" fill="#233d39">Prompt</text>
    <text x="928" y="232" text-anchor="middle" font-size="19" font-weight="400" fill="#233d39">Reply</text>
    <rect x="40" y="196" width="232" height="120" rx="12" fill="#f0f5f3" stroke="#36735f" stroke-width="2" />
    <text x="156.0" y="248.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">Current input</text>
    <text x="156.0" y="278.0" text-anchor="middle" font-size="21" font-weight="400" fill="#233d39">State + history</text>
    <rect x="352" y="56" width="240" height="84" rx="12" fill="#f8f5ec" stroke="#a66b3d" stroke-width="2" stroke-dasharray="7 5" />
    <text x="472.0" y="105.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">Optional knowledge</text>
    <rect x="352" y="196" width="240" height="120" rx="12" fill="#f0f5f3" stroke="#36735f" stroke-width="2" />
    <text x="472.0" y="248.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">Prompt construction</text>
    <text x="472.0" y="278.0" text-anchor="middle" font-size="21" font-weight="400" fill="#233d39">User + system*</text>
    <rect x="672" y="196" width="216" height="120" rx="12" fill="#e2efe6" stroke="#36735f" stroke-width="2" />
    <text x="780.0" y="248.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">Large Language</text>
    <text x="780.0" y="278.0" text-anchor="middle" font-size="21" font-weight="400" fill="#233d39">Model</text>
    <rect x="968" y="196" width="216" height="120" rx="12" fill="#f0f5f3" stroke="#36735f" stroke-width="2" />
    <text x="1076.0" y="248.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">Response</text>
    <text x="1076.0" y="278.0" text-anchor="middle" font-size="21" font-weight="400" fill="#233d39">validation</text>
    <rect x="968" y="354" width="216" height="84" rx="12" fill="#eef3f7" stroke="#39718a" stroke-width="2" />
    <text x="1076.0" y="403.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">Requested release</text>
  </g>
</svg>
