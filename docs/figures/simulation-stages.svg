<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title description">
<title id="title">Three simulation stages</title><desc id="description">Configure and check linked inputs. Prepare and save hydrological inflow with HydroCNHS. Run daily agents, reservoir water balance and routing, then verify and read the results.</desc><defs><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#32728c"/></marker><marker id="orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#aa673e"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#183630}.water{fill:none;stroke:#32728c;stroke-width:2;marker-end:url(#blue)}.decision{fill:none;stroke:#aa673e;stroke-width:2;marker-end:url(#orange)}</style><rect width="1000" height="420" fill="white"/><text x="28" y="48" text-anchor="start" font-weight="700">Simulation stages</text><rect x="18" y="100" width="300" height="150" rx="7" fill="#edf4f6" stroke="#32728c"/><text x="168.0" y="130" text-anchor="middle">1  Configure and check</text><text x="168.0" y="158" text-anchor="middle">Files, dates and units</text><text x="168.0" y="186" text-anchor="middle">Reservoir and agent IDs</text><rect x="350" y="100" width="300" height="150" rx="7" fill="#edf4f6" stroke="#32728c"/><text x="500.0" y="130" text-anchor="middle">2  Prepare inflow</text><text x="500.0" y="158" text-anchor="middle">HydroCNHS hydrology</text><text x="500.0" y="186" text-anchor="middle">Save daily upstream flow</text><rect x="682" y="100" width="300" height="150" rx="7" fill="#edf4f6" stroke="#32728c"/><text x="832.0" y="130" text-anchor="middle">3  Run daily operations</text><text x="832.0" y="158" text-anchor="middle">Agent → reservoir → routing</text><text x="832.0" y="186" text-anchor="middle">Verify and read results</text><path d="M318 174H347" class="water"/><path d="M650 174H679" class="water"/><text x="500" y="316" text-anchor="middle">Daily decisions use saved inflow and the updated reservoir state.</text></svg>
