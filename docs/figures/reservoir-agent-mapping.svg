<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title description">
<title id="title">Connect hydrology, reservoirs and agents</title><desc id="description">HydroCNHS is software. Subcatchment runoff is routed to its outlet, then bound to the physical reservoir inlet. A separate agent reads state and requests release. Actual outflow follows the physical network downstream.</desc><defs><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#32728c"/></marker><marker id="orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#aa673e"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#183630}.water{fill:none;stroke:#32728c;stroke-width:2;marker-end:url(#blue)}.decision{fill:none;stroke:#aa673e;stroke-width:2;marker-end:url(#orange)}</style><rect width="1000" height="420" fill="white"/><rect x="18" y="28" width="390" height="185" rx="10" fill="#f3f7f9" stroke="#9bb6c1"/><text x="38" y="58" text-anchor="start" font-weight="700">HydroCNHS · hydrology software</text><rect x="38" y="86" width="158" height="96" rx="7" fill="white" stroke="#32728c"/><text x="117.0" y="116" text-anchor="middle">Subcatchment</text><text x="117.0" y="144" text-anchor="middle">basin_a</text><text x="117.0" y="172" text-anchor="middle">runoff</text><rect x="232" y="86" width="156" height="96" rx="7" fill="white" stroke="#32728c"/><text x="310.0" y="116" text-anchor="middle">Routed outlet</text><text x="310.0" y="144" text-anchor="middle">outlet_a</text><path d="M196 134H229" class="water"/><path d="M388 134H482" class="water"/><text x="441" y="116" text-anchor="middle">binding</text><rect x="485" y="86" width="137" height="96" rx="7" fill="#edf4f6" stroke="#32728c"/><text x="553.5" y="116" text-anchor="middle">Inlet</text><text x="553.5" y="144" text-anchor="middle">inlet_a</text><rect x="661" y="86" width="143" height="96" rx="7" fill="#edf4f6" stroke="#32728c"/><text x="732.5" y="116" text-anchor="middle">Reservoir</text><text x="732.5" y="144" text-anchor="middle">lake_a</text><rect x="845" y="86" width="139" height="96" rx="7" fill="#edf4f6" stroke="#32728c"/><text x="914.5" y="116" text-anchor="middle">Downstream</text><text x="914.5" y="144" text-anchor="middle">river_a</text><path d="M622 134H658" class="water"/><path d="M804 134H842" class="water"/><text x="732" y="53" text-anchor="middle" font-weight="700">Physical reservoir network</text><rect x="661" y="288" width="143" height="84" rx="7" fill="#f7f0e9" stroke="#aa673e"/><text x="732.5" y="318" text-anchor="middle">Agent</text><text x="732.5" y="346" text-anchor="middle">operator_a</text><path d="M700 182V285" class="decision"/><path d="M764 288V185" class="decision"/><text x="684" y="232" text-anchor="end">State</text><text x="780" y="232" text-anchor="start">Requested release</text><text x="38" y="291" text-anchor="start" font-weight="700">IDs connect settings</text><text x="38" y="321" text-anchor="start">outlet_a → inlet_a: hydrology.yaml</text><text x="38" y="349" text-anchor="start">lake_a → operator_a: agent settings</text><text x="38" y="377" text-anchor="start">Blue: water. Orange: decision inputs and output.</text></svg>
