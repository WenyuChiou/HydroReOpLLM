<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="reservoir-agent-mapping-title reservoir-agent-mapping-desc">
  <title id="reservoir-agent-mapping-title">Connect hydrology, reservoir and agent</title>
  <desc id="reservoir-agent-mapping-desc">Blue water flow: basin_a to inlet_a to lake_a to river_a. Orange information: current lake_a state goes to operator_a, which requests release. The agent reservoir_id selects lake_a.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 5L0 10Z" fill="#39718a" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 5L0 10Z" fill="#a66b3d" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 5L0 10Z" fill="#36735f" />
    </marker>
  </defs>
  <rect width="1200" height="460" fill="#fff" />
  <g font-family="Arial, sans-serif" fill="#233d39">
    <text x="40" y="38" text-anchor="start" font-size="26" font-weight="700" fill="#233d39">Reservoir–agent mapping</text>
    <path d="M268 148H340" fill="none" stroke="#39718a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
    <path d="M556 148H628" fill="none" stroke="#39718a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
    <path d="M844 148H916" fill="none" stroke="#39718a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
    <path d="M688 208V320" fill="none" stroke="#a66b3d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-orange)" />
    <path d="M784 320V208" fill="none" stroke="#a66b3d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-orange)" />
    <text x="304" y="120" text-anchor="middle" font-size="19" font-weight="400" fill="#233d39">Runoff</text>
    <text x="592" y="120" text-anchor="middle" font-size="19" font-weight="400" fill="#233d39">Inflow</text>
    <text x="880" y="120" text-anchor="middle" font-size="19" font-weight="400" fill="#233d39">Outflow</text>
    <text x="676" y="270" text-anchor="end" font-size="19" font-weight="400" fill="#a66b3d">State</text>
    <text x="796" y="270" text-anchor="start" font-size="19" font-weight="400" fill="#a66b3d">Release</text>
    <rect x="40" y="88" width="228" height="120" rx="12" fill="#eef3f7" stroke="#39718a" stroke-width="2" />
    <text x="154.0" y="140.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">HydroCNHS</text>
    <text x="154.0" y="170.0" text-anchor="middle" font-size="21" font-weight="400" fill="#233d39">basin_a</text>
    <rect x="340" y="88" width="216" height="120" rx="12" fill="#eef3f7" stroke="#39718a" stroke-width="2" />
    <text x="448.0" y="140.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">Inlet node</text>
    <text x="448.0" y="170.0" text-anchor="middle" font-size="21" font-weight="400" fill="#233d39">inlet_a</text>
    <rect x="628" y="88" width="216" height="120" rx="12" fill="#eef3f7" stroke="#39718a" stroke-width="2" />
    <text x="736.0" y="140.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">Reservoir</text>
    <text x="736.0" y="170.0" text-anchor="middle" font-size="21" font-weight="400" fill="#233d39">lake_a</text>
    <rect x="916" y="88" width="244" height="120" rx="12" fill="#eef3f7" stroke="#39718a" stroke-width="2" />
    <text x="1038.0" y="140.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">Downstream</text>
    <text x="1038.0" y="170.0" text-anchor="middle" font-size="21" font-weight="400" fill="#233d39">river_a</text>
    <rect x="628" y="320" width="216" height="112" rx="12" fill="#faf1e8" stroke="#a66b3d" stroke-width="2" />
    <text x="736.0" y="368.0" text-anchor="middle" font-size="23" font-weight="700" fill="#233d39">Agent</text>
    <text x="736.0" y="398.0" text-anchor="middle" font-size="21" font-weight="400" fill="#233d39">operator_a</text>
  </g>
</svg>
