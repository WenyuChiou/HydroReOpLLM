<nav aria-label="HydroReOpLLM user manual">
  <div class="manual-nav-heading"><a href="{{ pathto('index') }}"{% if pagename == 'index' %} aria-current="page"{% endif %}>Overview</a><button class="contents-toggle" type="button" aria-expanded="false" aria-controls="manual-chapters" hidden>Contents <span aria-hidden="true">☰</span></button></div>
  {% include "searchbox.html" %}
  <div id="manual-chapters">
  {% for section in manual_sections %}
    {% if section.reference %}<details class="manual-reference"><summary>{{ section.title }}</summary>{% else %}<h3>{{ section.title }}</h3>{% endif %}
    <ul class="manual-navigation">
    {% for page in section.pages %}
      <li><a href="{{ pathto(page.path) }}"{% if pagename == page.path %} aria-current="page"{% endif %}>{{ page.label }}</a></li>
    {% endfor %}
    </ul>
    {% if section.reference %}</details>{% endif %}
  {% endfor %}
  </div>
</nav>
